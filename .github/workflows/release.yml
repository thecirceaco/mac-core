name: Build release ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: |
          mkdir -p dist/mac-core
          rsync -av \
            --exclude='/composer.lock' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='/.env' \
            --exclude='/.env.local' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.codex' \
            --exclude='.vscode' \
            --exclude='.ddev' \
            --exclude='/AGENTS.md' \
            --exclude='/README.md' \
            --exclude='/readme.txt' \
            --exclude='/composer.json' \
            --exclude='/phpcs.xml.dist' \
            --exclude='/phpunit.xml.dist' \
            --exclude='/licensing/README.md' \
            --exclude='/tests' \
            --exclude='/bin/install-wp-tests.sh' \
            --exclude='coverage' \
            --exclude='.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='.phpcs-cache' \
            --exclude='dist' \
            ./ dist/mac-core/

      - name: Create ZIP
        run: |
          cd dist
          zip -r mac-core-${GITHUB_REF_NAME}.zip mac-core

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mac-core-${{ github.ref_name }}.zip
